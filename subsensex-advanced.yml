name: Build SUBSENSE-X Advanced APK

on:
  push:
    branches: [subsensex-advanced]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SubsenseXAdvanced

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Create temporary signing key
        working-directory: .
        run: |
          keytool -genkeypair             -v             -keystore subsensex-debug.keystore             -storepass android             -keypass android             -alias androiddebugkey             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Android Debug,O=Android,C=US"

      - name: Sign APK
        working-directory: .
        run: |
          APK="SubsenseXAdvanced/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)

          "$APKSIGNER" sign             --ks subsensex-debug.keystore             --ks-pass pass:android             --key-pass pass:android             --ks-key-alias androiddebugkey             --v1-signing-enabled true             --v2-signing-enabled true             --v3-signing-enabled true             "$APK"

      - name: Verify APK signature
        working-directory: .
        run: |
          APK="SubsenseXAdvanced/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Rename final APK
        working-directory: .
        run: |
          mkdir -p release
          cp SubsenseXAdvanced/app/build/outputs/apk/debug/app-debug.apk release/SUBSENSE-X.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SUBSENSE-X-installable
          path: release/SUBSENSE-X.apk
